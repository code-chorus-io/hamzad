# hamzad configuration.
#
# Copy to the store directory or point at it with --config / HAMZAD_CONFIG.
# Every value can also be set via environment variables with the HAMZAD_ prefix,
# e.g. HAMZAD_CHROME_PATH, HAMZAD_STORE_DIR.

# Path to the Chrome/Chromium executable. Leave empty to auto-detect from PATH.
chrome_path = ""

# Pin a managed Chrome for Testing build, downloaded with `browser install`
# (e.g. "151.0.7922.76"). It outranks a detected system browser, so the engine
# stays matched to the fingerprint a profile was built around — and so everyone
# sharing a profile runs the same one. Leave empty to use whatever the host has.
chrome_version = ""

# Which named store to use. Stores are separate git repositories under
# $XDG_CONFIG_HOME/hamzad/stores/<name>, each with its own profiles, recipients
# and session bundles — so a work set can be shared with colleagues while a
# personal one stays private. Empty means "default".
store = ""

# Use a store at an explicit path instead, overriding `store`. The escape hatch
# for a store kept outside the config root: a shared checkout, an encrypted
# volume. Empty means derive the path from `store`.
store_dir = ""

# age or SSH private key used to decrypt secrets and session bundles.
# Encryption only needs the public recipients in the store; only decryption
# (open, pull, show --reveal) uses this key. Defaults to ~/.ssh/id_ed25519.
identity_path = ""
