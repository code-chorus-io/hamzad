name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The test workflow triggers on push-to-main and pull requests, so a tag push
  # would otherwise publish binaries nothing had re-checked.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
      - run: go test -race ./...

  goreleaser:
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      # Creating the release and uploading its assets needs write.
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # GoReleaser builds the changelog from history, and the version the
          # binary reports comes from the tag Go stamps into the build — both
          # need the full history and tags, not a shallow clone.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
